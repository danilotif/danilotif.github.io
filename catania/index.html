<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Catania — Monuments Map</title>

    <link href="../assets/img/favicon.png" rel="icon">
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">

    <style>
        html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        body { display: flex; flex-direction: column; }

        header.page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1.25rem;
            background: #fff;
            border-bottom: 1px solid #e5e7eb;
            z-index: 1;
        }
        header.page-header h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
        header.page-header a { font-size: 0.9rem; color: #0d6efd; text-decoration: none; }
        header.page-header a:hover { text-decoration: underline; }

        #map { flex: 1 1 auto; width: 100%; }
    </style>
</head>
<body>

<header class="page-header">
    <h1>Catania</h1>
    <a href="../index.html">&larr; Back to home</a>
</header>

<div id="map"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://tiles.openfreemap.org/styles/liberty',
        center: [15.0830, 37.5079],
        zoom: 13,
        minZoom: 12,
        maxZoom: 17,
        maxBounds: [[14.97, 37.44], [15.18, 37.56]]
    });

    map.addControl(new maplibregl.NavigationControl(), 'top-right');

    map.on('load', async () => {
        try {
            const response = await fetch('monuments.json');
            if (!response.ok) throw new Error('Failed to load monuments.json: ' + response.status);
            const monuments = await response.json();

            map.addSource('historic-centre', {
                type: 'geojson',
                data: {
                    type: 'Feature',
                    geometry: {
                        type: 'Polygon',
                        coordinates: [[
                            [15.080, 37.497],
                            [15.094, 37.497],
                            [15.094, 37.510],
                            [15.080, 37.510],
                            [15.080, 37.497]
                        ]]
                    }
                }
            });
            map.addLayer({
                id: 'historic-centre-fill',
                type: 'fill',
                source: 'historic-centre',
                paint: { 'fill-color': '#0d6efd', 'fill-opacity': 0.08 }
            });
            map.addLayer({
                id: 'historic-centre-outline',
                type: 'line',
                source: 'historic-centre',
                paint: { 'line-color': '#0d6efd', 'line-width': 1.5, 'line-dasharray': [2, 2] }
            });

            const routeOrder = [
                'Castello Ursino',
                'Cattedrale di Sant\'Agata',
                'Fontana dell\'Elefante',
                'Teatro Massimo Bellini',
                'Monastero dei Benedettini'
            ];
            const byName = Object.fromEntries(monuments.map(m => [m.name, m]));
            const routeCoords = routeOrder
                .map(name => byName[name])
                .filter(Boolean)
                .map(m => [m.lng, m.lat]);
            map.addSource('walking-route', {
                type: 'geojson',
                data: {
                    type: 'Feature',
                    geometry: { type: 'LineString', coordinates: routeCoords }
                }
            });
            map.addLayer({
                id: 'walking-route-line',
                type: 'line',
                source: 'walking-route',
                layout: { 'line-cap': 'round', 'line-join': 'round' },
                paint: { 'line-color': '#dc3545', 'line-width': 3, 'line-opacity': 0.85 }
            });

            const features = [];
            for (let i = 0; i < monuments.length; i++) {
                const monument = monuments[i];
                const iconId = `monument-icon-${i}`;
                try {
                    const imageData = await renderMonumentIcon(monument);
                    map.addImage(iconId, imageData, { pixelRatio: 2 });
                    features.push({
                        type: 'Feature',
                        geometry: { type: 'Point', coordinates: [monument.lng, monument.lat] },
                        properties: {
                            name: monument.name,
                            lat: monument.lat,
                            lng: monument.lng,
                            iconId
                        }
                    });
                } catch (e) {
                    console.error(`Failed to render marker for "${monument.name}":`, e);
                }
            }

            map.addSource('monuments', {
                type: 'geojson',
                data: { type: 'FeatureCollection', features }
            });
            map.addLayer({
                id: 'monuments-layer',
                type: 'symbol',
                source: 'monuments',
                layout: {
                    'icon-image': ['get', 'iconId'],
                    'icon-size': [
                        'interpolate', ['exponential', 1.5], ['zoom'],
                        12, 0.5,
                        17, 1.6
                    ],
                    'icon-allow-overlap': true,
                    'icon-anchor': 'center'
                }
            });

            map.on('click', 'monuments-layer', (e) => {
                const p = e.features[0].properties;
                const url = `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`;
                window.open(url, '_blank', 'noopener');
            });

            const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 18 });
            map.on('mouseenter', 'monuments-layer', (e) => {
                map.getCanvas().style.cursor = 'pointer';
                popup
                    .setLngLat(e.features[0].geometry.coordinates)
                    .setText(e.features[0].properties.name)
                    .addTo(map);
            });
            map.on('mouseleave', 'monuments-layer', () => {
                map.getCanvas().style.cursor = '';
                popup.remove();
            });
        } catch (err) {
            console.error('Could not load monuments:', err);
        }
    });

    function loadImageElement(src) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = () => reject(new Error('Failed to load image: ' + src));
            img.src = src;
        });
    }

    async function renderMonumentIcon(monument) {
        let img = null;
        try {
            img = await loadImageElement(monument.image);
        } catch (e) {
            // image missing → grey placeholder for circular style
        }

        const dpr = 2;

        if (monument.transparent && img) {
            const maxDim = (monument.size || 70) * dpr;
            const ratio = Math.min(maxDim / img.naturalWidth, maxDim / img.naturalHeight, 1);
            const w = Math.max(1, Math.round(img.naturalWidth * ratio));
            const h = Math.max(1, Math.round(img.naturalHeight * ratio));
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            return ctx.getImageData(0, 0, w, h);
        }

        const size = 60 * dpr;
        const cx = size / 2;
        const cy = size / 2;
        const radius = 25 * dpr;
        const border = 2 * dpr;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        ctx.shadowColor = 'rgba(0,0,0,0.35)';
        ctx.shadowBlur = 6 * dpr;
        ctx.shadowOffsetY = 2 * dpr;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;

        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, radius - border, 0, Math.PI * 2);
        ctx.clip();
        if (img) {
            ctx.drawImage(img, cx - radius, cy - radius, radius * 2, radius * 2);
        } else {
            ctx.fillStyle = '#ddd';
            ctx.fillRect(cx - radius, cy - radius, radius * 2, radius * 2);
        }
        ctx.restore();

        ctx.strokeStyle = '#fff';
        ctx.lineWidth = border;
        ctx.beginPath();
        ctx.arc(cx, cy, radius - border / 2, 0, Math.PI * 2);
        ctx.stroke();

        return ctx.getImageData(0, 0, size, size);
    }
</script>

</body>
</html>
